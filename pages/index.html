<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nanna — Contemporary Tufting Studio</title><meta name="description" content="İstanbul’da tasarlanan özgün tekstil yüzeyleri."><link rel="icon" href="./favicon.svg">
  <style>
  *{box-sizing:border-box}body{margin:0;background:#e8dfcf;color:#24211d;font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.page{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}.quilt,.wash{position:absolute;inset:0}.quilt{background:url('./nanna-tufting-hero.png') center/cover no-repeat;transform:scale(1.015)}.wash{background:linear-gradient(180deg,#fffaf02e,#634e3414 60%,#251f1738)}header{position:relative;z-index:3;padding:32px 6vw 0}.nav{display:grid;grid-template-columns:repeat(6,1fr);background:#f8f6f1e8;border:1px solid #322d262e;box-shadow:0 8px 24px #4437261a}.nav a{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;border-right:1px solid #322d2621;font:700 .7rem 'Arial Narrow',Arial;letter-spacing:.055em}.nav a:last-child{border:0}.nav a:hover,.nav a.active{background:#282725;color:#fff}.langs{position:absolute;top:105px;right:6vw;display:flex;padding:4px;background:#ffffffe6;border-radius:24px;box-shadow:0 8px 24px #32281b24}.langs button{border:0;background:none;border-radius:19px;padding:8px 11px;color:#766f65;font-size:.72rem;letter-spacing:.08em;cursor:pointer}.langs button.active{background:#292724;color:#fff}.langs span{margin-right:5px}.menu{display:none}.center{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:140px 20px 90px}.frame{position:relative;padding:5px;background:#f8f5ef;border:2px solid #34312d;border-radius:30%/40%;box-shadow:0 12px 32px #372a2e2e}.frame:before,.frame:after{content:'';position:absolute;top:36%;width:24px;height:42px;background:#f8f5ef;border:2px solid #34312d}.frame:before{left:-14px;border-right:0;border-radius:50% 0 0 50%}.frame:after{right:-14px;border-left:0;border-radius:0 50% 50% 0}.inner{position:relative;z-index:1;border:1px solid #777067;border-radius:28%/40%;padding:22px 68px;background:#fffdf9}.inner h1{margin:0;color:#a72325;font:italic 400 clamp(3.4rem,6vw,5.6rem)/1 'Brush Script MT','Segoe Script',cursive;letter-spacing:-.04em}.inner sup{font:600 .8rem Arial;margin-left:5px;vertical-align:top}.tag{margin:16px 0 0;color:#4f4941;font-size:.62rem;font-weight:700;letter-spacing:.32em;text-shadow:0 1px 5px #fff}footer{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:24px 6vw 28px;border-top:1px solid #2f2a2338;background:#f9f6ef8a;backdrop-filter:blur(5px)}footer>div:first-child{display:flex;flex-direction:column;gap:5px;font-family:Georgia,serif}footer span{font-size:.78rem}.social{display:flex;gap:9px}.social a{width:34px;height:34px;border-radius:50%;background:#282725;color:white;display:grid;place-items:center;font-weight:bold}small{justify-self:end;font-size:.65rem;letter-spacing:.08em}
  @media(max-width:900px){header{padding:20px 5vw}.menu{display:grid;place-items:center;position:relative;z-index:4;margin-left:auto;width:46px;height:46px;border:0;border-radius:50%;background:#292725;color:#fff}.nav{position:absolute;top:76px;left:5vw;right:5vw;display:none;grid-template-columns:1fr}.nav.open{display:grid}.nav a{border-right:0;border-bottom:1px solid #322d2621}.langs{top:20px;left:5vw;right:auto}.center{padding-top:100px}.inner{padding:18px 42px}footer{grid-template-columns:1fr auto;gap:16px}small{grid-column:1/-1;justify-self:start}}
  </style>
</head>
<body><main class="page"><div class="quilt"></div><div class="wash"></div><header><button class="menu" aria-label="Menü">☰</button><nav class="nav"></nav><div class="langs"><button data-lang="tr" class="active"><span>🇹🇷</span>TR</button><button data-lang="en"><span>🇬🇧</span>EN</button></div></header><section class="center"><div class="frame"><div class="inner"><h1>Nanna<sup>®</sup></h1></div></div><p class="tag">TUFTING · ISTANBUL</p></section><footer><div><a href="mailto:info@nanna.com.tr">info@nanna.com.tr</a><span id="place">İstanbul, Türkiye</span></div><div class="social"><a href="https://www.instagram.com/nannatufting" aria-label="Instagram">ig</a><a href="https://www.facebook.com/nannatufting" aria-label="Facebook">f</a></div><small>© 2026 Nanna. All rights reserved.</small></footer></main>
<script>
const data={tr:{nav:['ANASAYFA','KOLEKSİYON','UYGULAMA VİDEOLARI','HİKÂYEMİZ','İLETİŞİM','NEREDEYİZ?'],place:'İstanbul, Türkiye'},en:{nav:['HOME','COLLECTION','APPLICATION VIDEOS','OUR STORY','CONTACT','WHERE ARE WE?'],place:'Istanbul, Turkey'}};const nav=document.querySelector('.nav');function render(l){nav.innerHTML=data[l].nav.map((x,i)=>`<a class="${i?'':'active'}" href="#">${x}</a>`).join('');document.querySelector('#place').textContent=data[l].place;document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l))}render('tr');document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>render(b.dataset.lang));document.querySelector('.menu').onclick=()=>nav.classList.toggle('open');
</script></body></html>
