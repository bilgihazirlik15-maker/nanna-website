<script>
const data={tr:{nav:['ANASAYFA','KOLEKSİYON','UYGULAMA VİDEOLARI','HİKÂYEMİZ','İLETİŞİM','NEREDEYİZ?'],place:'İstanbul, Türkiye'},en:{nav:['HOME','COLLECTION','APPLICATION VIDEOS','OUR STORY','CONTACT','WHERE ARE WE?'],place:'Istanbul, Turkey'}};const nav=document.querySelector('.nav');function render(l){nav.innerHTML=data[l].nav.map((x,i)=>`<a class="${i?'':'active'}" href="#">${x}</a>`).join('');document.querySelector('#place').textContent=data[l].place;document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l))}render('tr');document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>render(b.dataset.lang));document.querySelector('.menu').onclick=()=>nav.classList.toggle('open');
